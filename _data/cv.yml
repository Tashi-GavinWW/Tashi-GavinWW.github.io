    Research:
      - company: Diffusion-Based Multi-View 3D Object Removal
        position: Research Project
        location: Duke Kunshan University
        start_date: 2026
        end_date: Present
        summary: Reconstruction-aware multi-view object removal with continuous confidence distributions over independently inpainted views.
        highlights:
          - Integrated 3DGS reliability estimation, proxy-to-full NeRF expert search, and conditional diffusion.
          - Built CoRe-MV, a 50-scene synthetic benchmark with masks, depth, and calibrated cameras.
          - Reduced Masked FID and warping error by 20.3% and 16.3% on average vs. NeRF/3DGS baselines.

      - company: 3D Photorealistic Multi-view Object Removal and Scene Completion
        position: Research Project
        location: Duke Kunshan University
        start_date: 2025
        end_date: Present
        summary: View-aware object removal framework (SPDP) with diffusion-based per-view sampling for consistent multi-view background reconstruction.
        highlights:
          - PSNR 29.19, outperforming OR-NeRF and NeRFiller on captured and generated datasets.
          - Robust under multi-view inconsistencies by suppressing corrupted views.

      - company: Cross-Device Open-World Robotic Grasping in 3D Point Clouds
        position: Research Project
        location: Duke Kunshan University
        start_date: 2025
        end_date: 2026
        summary: Category-agnostic grasping transferred across heterogeneous cameras and robot arms without retraining.
        highlights:
          - 97.2% mean recognition and 85.1% mean grasp success across 13 real-world scenarios.
          - SSGC-Seg and ScoreNet++ improved robustness under domain shift and lighting changes.

      - company: Bio-Inspired Associative Memory Learning in Hopfield Networks
        position: Research Project
        location: Duke Kunshan University
        start_date: 2024
        end_date: 2025
        summary: Predictive-Error Hopfield (PEH) framework for robust memory recall with biologically inspired learning.
        highlights:
          - Strong gains over classical Hopfield and Storkey rules on MNIST and KMNIST under high memory load.

      - company: Dexterous Manipulation and Embodied Intelligence
        position: Research Project
        location: Duke Kunshan University
        start_date: 2025
        end_date: 2026
        summary: RL/IL dexterous manipulation for deformable objects, with deployment on Unitree G1 and VLA policies.
        highlights:
          - Surveyed 300+ papers and 20+ dexterous robotic platforms.
          - Covered grasping, deformable objects, tool use, assembly, and human-robot collaboration.

